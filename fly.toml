app = 'ultimate-ts-server'
primary_region = 'gru'            

[build]
  dockerfile = 'Dockerfile'

[[mounts]]                       
  source = 'ts_data'
  destination = '/var/tsserver'

[[services]]
  protocol = 'udp'
  internal_port = 9987
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 9987

[[services]]                     
  protocol = 'tcp'
  internal_port = 30033

  [[services.ports]]
    port = 30033

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024